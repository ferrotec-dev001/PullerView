; PullerView DataSetting.ini（r3 書式・サンプル。index・上下限は仮値。NECK〜TAIL の 1 枠目は 8 インチ直径(idx65, 約215mm)向けの例）
; 文字コード: UTF-8 / コメント: ';' または '#'
; セクション: [<工程略称><n>]  n=1..4（工程ごとに最大4グラフ。要件 D-21 確定）
;   対象工程と略称（13 状態。2026-10-21 中村氏要件: 自動モードの全工程 + OTHER）
;     STATUS_CHECK=STCK  VACUUM=VACM  LEAK_CHECK=LKCK  MELT=MELT  STABILIZE=STAB  NECK=NECK  CROWN=CRWN
;     SHOULDER=SHLD  BODY=BODY  TAIL=TAIL  ANEEL=ANEL  SHUTDOWN=SHDW
;     OTHER=OTHER … AUTO（自動モードで工程未開始）/ MANUAL / WAITMATERIALS / MAINTENANCE をまとめた 1 状態
;   セクション名は略称・正式名のどちらでも可（[CRWN1] / [CROWN1]）。[AUTO1] 等の旧名は OTHER の別名として受理
; enable               : 0=disable, 1=visible
; pv_pcinfodata_index  : PV の stcMCValue index（0〜134。ライブ値は stcRealData.intIOBit から算出。要件 FR-DT-04）
; caption              : 0=stcMCValue の caption を使用, 1=caption_text を使用（要件 D-07 確定）
; caption_text         : caption=1 のときの表示名（任意キー）
; unit                 : 0=stcMCValue の unit を使用,    1=unit_text を使用
; unit_text            : unit=1 のときの単位（任意キー）
; sv_pcinfodata_index  : SV の stcMCValue index
; usl / ucl / lcl / lsl: 規格上限 / 管理上限 / 管理下限 / 規格下限（PV 絶対値に対する閾値。PV と同じ単位。要件 D-04 確定）
; length / length_span : 【未使用】X 軸（結晶長さ）の最大値・目盛間隔は PullerView.ini の [Graph] xaxis_max_mm / xaxis_span_mm で
;                        設定し、設定画面から変更できる（2026-10-21 中村氏指示: 投入量により最大値が変わるため可変とする）
; warningcolor         : 管理上下限(ucl/lcl)超過時のグラフ背景色（6桁16進 RRGGBB、'#'なし。要件 D-20 確定）
; alarmcolor           : 規格上下限(usl/lsl)超過時のグラフ背景色（同上）
; ※ 異常フラグの Remoting 引渡しは行わない（r2 で削除、ADR-0009）

