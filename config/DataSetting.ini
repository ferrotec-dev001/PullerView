; PullerView DataSetting.ini（r2 書式・サンプル。index・上下限はダミー）
; 文字コード: UTF-8 / コメント: ';' または '#'
; セクション: [<工程略称><n>]  n=1..4（工程ごとに最大4グラフ。要件 D-21 確定）
;   対象工程と略称: NECK=NECK CROWN=CRWN SHOULDER=SHLD BODY=BODY TAIL=TAIL（他の11工程は対象外＝グラフなし）
;   正式名（[CRWN1] 等）は互換の別名として受理
; enable               : 0=disable, 1=visible
; pv_pcinfodata_index  : PV の stcMCValue index（0〜134。ライブ値は stcRealData.intIOBit から算出。要件 FR-DT-04）
; caption              : 0=stcMCValue の caption を使用, 1=直接使用（直接指定の書式は要件 D-07）
; unit                 : 0=stcMCValue の unit を使用,    1=直接使用
; sv_pcinfodata_index  : SV の stcMCValue index
; usl / ucl / lcl / lsl: 規格上限 / 管理上限 / 管理下限 / 規格下限（判定対象は要件 D-04）
; length               : グラフ X 軸最大範囲 [mm]
; length_span          : グラフ X 軸スパン [mm]（意味は要件 D-05）
; warningcolor         : 管理上下限(ucl/lcl)超過時のグラフ背景色（6桁16進 RRGGBB、'#'なし。要件 D-20 確定）
; alarmcolor           : 規格上下限(usl/lsl)超過時のグラフ背景色（同上）
; ※ 異常フラグの Remoting 引渡しは行わない（r2 で削除、ADR-0009）

[NECK1]
enable=1
pv_pcinfodata_index=65
caption=0
unit=0
sv_pcinfodata_index=92
usl=1.0
ucl=0.5
lcl=-0.5
lsl=-1.0
length=2300
length_span=100
warningcolor=000066
alarmcolor=800000

