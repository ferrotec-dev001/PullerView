; PullerView DataSetting.ini（r1 書式・サンプル。値はダミー）
; 文字コード: UTF-8 / コメント: ';' または '#'
; セクション: [<工程名><n>]  n=1..4（工程ごとに最大4グラフ）
;   工程名: VACUUM LEAK_CHECK MELT STABILIZE NECK CROWN SHOULDER BODY TAIL ANEEL SHUTDOWN
;           AUTO STATUS_CHECK MANUAL WAITMATERIALS MAINTENANCE   （対象範囲は要件 D-06）
; enable               : 0=非表示, 1=表示
; pv_pcinfodata_index  : PV の stcMCValue index（TP_PcInfo に対応がある index のみ有効。docs/pcinfo-mapping.md）
; caption / unit       : 0=stcMCValue の定義を使用, 1=直接使用（直接指定の書式は要件 D-07）
; sv_pcinfodata_index  : SV の stcMCValue index
; usl / ucl / lcl / lsl: 規格上限 / 管理上限 / 管理下限 / 規格下限（判定対象は要件 D-04）
; length               : グラフ X 軸最大範囲 [mm]
; length_span          : グラフ X 軸スパン [mm]（意味は要件 D-05）

[VACUUM1]
enable=1
pv_pcinfodata_index=65
caption=0
unit=0
sv_pcinfodata_index=92
usl=1.0
ucl=0.5
lcl=-0.5
lsl=-1.0
length=2300
length_span=100

