; PullerView.ini — PullerView の設定（設定画面の OK で自動保存。手動編集も可。EXE と同じフォルダに置く）
; 文字コード: UTF-8

[Graph]
; xaxis_max_mm  : X 軸（結晶長さ）の最大値 [mm]。投入量に合わせて変更（例: 2500 / 3500）
; xaxis_span_mm : X 軸の目盛間隔 [mm]。0=自動（最大値を 5〜8 分割するきりの良い値）
; auto_y        : 1=Y 軸を PV の範囲に自動調整、0=USL/LSL 基準
; judge_sec     : 異常確定に必要な連続秒数（チャタリング防止）
xaxis_max_mm=3500
xaxis_span_mm=0
auto_y=0
judge_sec=2

[Window]
; bgcolorRGB  : 背景色（10 進 9 桁 RRRGGGBBB）
; opacity_pct : 不透明度 [%]
; bg_only     : 1=背景のみ透過（線・文字は不透明、Win32 UpdateLayeredWindow）、0=ウィンドウ全体を半透明
; logo        : ロゴ案（1=インゴット＋トレンド）
; lang        : 0=日本語 1=英語 2=中国語
; standalone  : 1=VB_FERROTEC.exe（frmAutoStatus）が無くても表示する（単体起動）、0=未検出時は非表示
; pos_x/pos_y : frmAutoStatus 左上からの表示位置 [px]（ドラッグで移動すると自動保存）
bgcolorRGB=077077077
opacity_pct=65
bg_only=1
logo=1
lang=0
standalone=1
pos_x=300
pos_y=67

[Comment]
; colorRGB    : 異常名称の文字色（RRRGGGBBB）  size_pt: 文字サイズ  scroll_left: 1=左へスクロール  speed: スクロール速度
colorRGB=255213079
size_pt=9
scroll_left=1
speed=4

[Host]
; VB_FERROTEC.exe から接続されるための待受設定（PullerView は待受側。VB_FERROTEC_SERVER は使用しない）
; remote_port / socket_port : VB_FERROTEC.exe の Application.ini [Server] RemotePort / SocketPort と同じ値にする
; bind_ip                   : 待受 IP（空=全アダプタ）。Application.ini の HostIP が自 PC の IP ならその値でも可
; application_ini           : パスを指定すると、その Application.ini [Server] からポートを読む（空=上の値を使用）
; common_dll                : VB_FERROTEC_Common.dll のパス（既定: EXE と同じフォルダ）
; process_name              : VB_FERROTEC.exe のプロセス名（拡張子なし）
; autostatus_title / autostatus_size : frmAutoStatus 検出条件（ウィンドウタイトル、無題の場合はクライアントサイズで判定）
remote_port=10030
socket_port=10031
bind_ip=
application_ini=
common_dll=VB_FERROTEC_Common.dll
process_name=VB_FERROTEC
autostatus_title=frmAutoStatus
autostatus_size=1126,670

[Ment]
; ソケット電文の構成要素。VB_FERROTEC.exe の Ment.ini [Soket Package Element] と同じ値にする
stx=2
etx=3
from_id=02
to_id=01
worksection_id=01
