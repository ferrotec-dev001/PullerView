; VisionView.ini — 晶線解析（VisionView）の設定。PullerView.exe と同じフォルダに置く（文字コード UTF-8）。設定画面の「保存」で上書きされる
[Vision]
enable=1              ; 1=晶線解析を使う 0=使わない（0 のとき PullerView は単体版と同じ動作）
source=file            ; 画像入力元: camera（TCP）／file（ファイル再生）／sim（模擬カメラ。再生フォルダの画像を本機内で TCP 送信）
process_source=auto    ; 工程の取得元: auto（VB_FERROTEC。未接続時は manual）／manual／filename（…_NECK.bmp）
manual_process=BODY
crystal_orientation=100  ; 100=4 本・90° / 111=3 本・120° / 110=2 本・180°
truth_n=10             ; 真偽度の測定窓 N（直近 N 回。判定対象外の画像は数えない）
ng_threshold_pct=50    ; 真偽度がこの値を下回ると NG（同じ値は OK）
judge_delay_sec=300    ; 検出開始時間 [秒]。工程切替からこの時間はカウント・判定しない。ファイル再生での確認は 0 にする
tolerance_deg=8        ; 期待位置の許容角度 [°]
pair_tol_deg=10        ; 組（pair）判定の角度差の許容 [°]
ring_aspect=0.93       ; リングの縦横比 b/a（カメラの見下ろし角で決まる。輪郭方式で使用）
pane=1                ; 1=右欄（VisionView）を開く 0=畳む（タイトル行のカメラのアイコンで切替）
display_gain=3.4      ; 画面に表示する画像の明るさ補正（解析には影響しない）
display_gamma=0.55

[Camera]   ; VB_FERROTEC との接続（PullerView.ini [Host]）とは別の設定
ip=192.168.0.10
port=8501             ; 画像出力ポート番号
delimiter=CR          ; CR / CRLF（受信はどちらも受け付ける。模擬カメラの送信に使用）
camera_no=1           ; 0=全カメラ 1〜4=そのカメラだけ
reconnect_sec=5
timeout_sec=5
reject_checksum=0     ; 1=チェックサム不一致の画像を破棄する
raw_dump=0            ; 1=診断用に受信した生データを Log\raw-*.bin へ保存する（接続ごとに先頭 2MB）

[Image]    ; 受信した画像の保存。OK／NG は判断せず 1 つのフォルダへ保存する
save=1
save_mode=all         ; all=全数 thin=間引き（save_every 枚に 1 枚）
save_every=5
folder=Image          ; 相対は EXE 基準。ファイル名 YYYYMMDDHHMMSS_工程名.bmp
max_files=10          ; 最大保持枚数（0=無制限。超過分は古い順に削除）
keep_days=30          ; 保持日数（0=無効）
cleanup_hours=1

[Playback] ; ファイル再生（source=file／sim）
folder=Image\sample
interval_ms=600
loop=1

[NECK]
enable=1              ; 0=この工程は晶線解析の対象外にする
contour=brightness       ; brightness（輝度方式）／edge・ridge（輪郭方式）
judge=single
seam_threshold=1
seam_threshold_strong=1   ; pair のとき、組の強い方に必要な値
detect_range=20:175   ; 検出範囲 [°]。2 区間のときは間がシールド遮蔽範囲
hidden_rule=off      ; 未検出の画像の扱い: off／hold／predict
hide_hold_sec=20
hide_margin_deg=5
hide_lost_sec=60

[CROWN]
enable=1              ; 0=この工程は晶線解析の対象外にする
contour=edge       ; brightness（輝度方式）／edge・ridge（輪郭方式）
judge=pair
seam_threshold=0.6
seam_threshold_strong=0.8   ; pair のとき、組の強い方に必要な値
detect_range=-6:186   ; 検出範囲 [°]。2 区間のときは間がシールド遮蔽範囲
hidden_rule=off      ; 未検出の画像の扱い: off／hold／predict
hide_hold_sec=20
hide_margin_deg=5
hide_lost_sec=60

[SHOULDER]   ; この工程の設定値は未定（仮の値）
enable=1              ; 0=この工程は晶線解析の対象外にする
contour=edge       ; brightness（輝度方式）／edge・ridge（輪郭方式）
judge=pair
seam_threshold=0.6
seam_threshold_strong=0.8   ; pair のとき、組の強い方に必要な値
detect_range=-6:186   ; 検出範囲 [°]。2 区間のときは間がシールド遮蔽範囲
hidden_rule=off      ; 未検出の画像の扱い: off／hold／predict
hide_hold_sec=20
hide_margin_deg=5
hide_lost_sec=60

[BODY]
enable=1              ; 0=この工程は晶線解析の対象外にする
contour=ridge       ; brightness（輝度方式）／edge・ridge（輪郭方式）
judge=single
seam_threshold=0.2
seam_threshold_strong=0.2   ; pair のとき、組の強い方に必要な値
detect_range=18:62,122:160   ; 検出範囲 [°]。2 区間のときは間がシールド遮蔽範囲
hidden_rule=hold      ; 未検出の画像の扱い: off／hold／predict
hide_hold_sec=20
hide_margin_deg=5
hide_lost_sec=60

[TAIL]   ; この工程の設定値は未定（仮の値）
enable=0              ; 0=この工程は晶線解析の対象外にする
contour=brightness       ; brightness（輝度方式）／edge・ridge（輪郭方式）
judge=single
seam_threshold=1
seam_threshold_strong=1   ; pair のとき、組の強い方に必要な値
detect_range=20:175   ; 検出範囲 [°]。2 区間のときは間がシールド遮蔽範囲
hidden_rule=off      ; 未検出の画像の扱い: off／hold／predict
hide_hold_sec=20
hide_margin_deg=5
hide_lost_sec=60
