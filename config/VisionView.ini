; VisionView.ini — 晶線解析（VisionView）の設定。PullerView.exe と同じフォルダに置く（文字コード UTF-8）。設定画面の「保存」で上書きされる
[Vision]
enable=1              ; 1=晶線解析を使う 0=使わない（0 のとき PullerView は単体版と同じ動作）
source=file            ; 画像入力元: camera（[Camera] model の装置）／file（ファイル再生）／sim（模擬カメラ。再生フォルダの画像を、実機と同じ経路で本機内から流す）
process_source=auto    ; 工程の取得元: auto（VB_FERROTEC。未接続時は manual）／manual／filename（…_NECK.bmp／.jpg）
manual_process=BODY
crystal_orientation=100  ; 100=4 本・90° / 111=3 本・120° / 110=2 本・180°
truth_n=10             ; 真偽度の測定窓 N（直近 N 回。判定対象外の画像は数えない）
ng_threshold_pct=50    ; 真偽度がこの値を下回ると NG（同じ値は OK）
judge_delay_sec=300    ; 検出開始時間 [秒]。工程切替からこの時間はカウント・判定しない。ファイル再生での確認は 0 にする
tolerance_deg=8        ; 期待位置の許容角度 [°]
pair_tol_deg=10        ; 組（pair）判定の角度差の許容 [°]
ring_aspect=0.93       ; リングの縦横比 b/a（カメラの見下ろし角で決まる。輪郭方式で使用）
pane=1                ; 1=右欄（VisionView）を開く 0=畳む（タイトル行のカメラのアイコンで切替）
display_gain=3.4      ; 画面に表示する画像の明るさ補正（解析には影響しない）
display_gamma=0.55

[Camera]   ; VB_FERROTEC との接続（PullerView.ini [Host]）とは別の設定
model=cv              ; 画像処理装置の機種: cv（CV シリーズ。下の ip／port へ TCP 接続）／xgx（XG-X。[Xgx] の設定で取り込み）
ip=192.168.0.10
port=8501             ; 画像出力ポート番号
delimiter=CR          ; CR / CRLF（受信はどちらも受け付ける。模擬カメラの送信に使用）
camera_no=1           ; 0=全カメラ 1〜4=そのカメラだけ
reconnect_sec=5
timeout_sec=5
reject_checksum=0     ; 1=チェックサム不一致の画像を破棄する
raw_dump=0            ; 1=診断用に受信した生データを Log\raw-*.bin へ保存する（接続ごとに先頭 2MB）

[Xgx]      ; XG-X からの画像取り込み（model=xgx のとき）。接続先は [Camera] の ip／port とは別
mode=bridge            ; bridge=直接受信（XgxBridge が Vapi.Net.dll で XG-X に接続）／folder=フォルダ監視のみ（VisionTerminal・FTP 出力が受信フォルダへ保存）
ip=192.168.1.20       ; XG-X の IP アドレス（bridge のみ）。ポート番号の設定は無い
spool_folder=XgxRecv   ; 受信フォルダ（作業用。相対は EXE 基準）。取り込んだ画像（BMP／JPG）はここから削除する。画像保存フォルダ・再生フォルダとは別にする。100 文字以内・半角英数字を推奨
vapi_folder=          ; XG-X VisionTerminal のインストール先フォルダ（Vapi.Net.dll のあるフォルダ。bridge のみ）
bridge_exe=           ; 空＝EXE フォルダの XgxBridge\PullerView.XgxBridge.exe
stable_ms=1000         ; 書込み完了とみなす無変化時間 [ms]
scan_ms=500            ; 受信フォルダの確認間隔 [ms]
detailed_log=0        ; 1=調査用: 接続の各段階・取り込み 1 件ごとを PullerView.log に記録する

[Image]    ; 受信した画像の保存。OK／NG は判断せず 1 つのフォルダへ保存する
save=1
save_mode=all         ; all=全数 thin=間引き（save_every 枚に 1 枚）
save_every=5
folder=Image          ; 相対は EXE 基準。ファイル名 YYYYMMDDHHMMSS_工程名.bmp／.jpg（受け取った形式のまま保存）
max_files=10          ; 最大保持枚数（0=無制限。超過分は古い順に削除）
keep_days=30          ; 保持日数（0=無効）
cleanup_hours=1

[Snap]     ; 画像の保存（[Image] とは別のフォルダ。自動削除の対象外）。各フォルダに画像（BMP／JPG）と記録 snap.csv を置く
enable=1
auto_ng=1               ; 1=現在の判定基準で未検出と数えた画像を、自動で ng_folder へ保存する
ng_folder=NG_SNAP      ; 自動保存と「NGへ保存」ボタンの保存先。相対は EXE 基準
ok_folder=OK_SNAP      ; 「OKへ保存」ボタンの保存先
max_files=1000        ; フォルダごとの上限枚数（0=無制限）。フルサイズ画像は 1 枚約 15 MB、1/2 サイズは約 3.7 MB
on_full=stop            ; 上限に達したとき: stop（保存しない。古い画像を残す）／delete_oldest（古い画像から削除して保存）

[Playback] ; ファイル再生（source=file／sim）
folder=NG_SNAP
interval_ms=600
loop=1

[NECK]
enable=1              ; 0=この工程は晶線解析の対象外にする
contour=brightness       ; brightness（輝度方式）／edge・ridge（輪郭方式）
judge=single
seam_threshold=1
seam_threshold_strong=1   ; pair のとき、組の強い方に必要な値
detect_range=20:175   ; 検出範囲 [°]。2 区間のときは間がシールド遮蔽範囲
hidden_rule=off      ; 未検出の画像の扱い: off／hold／predict
hide_hold_sec=20
hide_margin_deg=5
hide_lost_sec=60
search_frame=0        ; 1=探索枠を使う（リングを探す範囲を画像の一部に限る。XG-X のように坩堝全体が写る画像で使う）
search_rect=40,40,20,20   ; 探索枠: 左,上,幅,高さ [画像の幅・高さに対する %]
search_auto=1         ; 1=枠の中でメニスカスを自動検出し、その周辺を解析する／0=枠そのものを解析する

