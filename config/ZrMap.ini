; ZrMap.ini — stcRealData.intIOBit（ZR110000〜ZR112299、2,300 ワード）のアドレス別データ定義。グラフの PV / SV に ZR アドレスを直接指定するための一覧
; 生成元: ZR110200.xlsx（12 インチ FT-CZ3212 アドレス割り付け表「PC IF ﾃﾞｰﾀ」）。手動で編集可（設定画面の「再読込」または再起動で反映）
; DataSetting.ini の pv_pcinfodata_index / sv_pcinfodata_index に 110000 以上の値を書くと ZR アドレスとして扱う（例: pv_pcinfodata_index=110504）
; [ZR<アドレス>]  words=1（16bit）/ 2（32bit: このアドレスが下位ワード、+1 が上位ワード）  signed=1（符号付き）/ 0
;               div=除数（表示値 = 生値 ÷ div）  unit=単位  caption=項目名（caption_e / caption_j / caption_c があれば言語別に優先）
;               div_src=mcmeta（装置から受信した McMeta.ini の除数。確認済み）/ table（割り付け表の書式 XXX.X から推定。未確認）/ none（表に書式なし。div=1 は仮）
; 注意: div_src=table / none の除数は実機の値と照合していない。ZR110200〜110499 では表の書式と装置の除数が 130 項目中 27 項目で食い違ったため、使う項目は実機の表示値と比べて確認すること
; ここに無いアドレス（表に記載のない ZR111200〜111499、ZR111700〜111999 など）も指定できる。その場合は words=1 / div=1 / 名称なしで扱う
