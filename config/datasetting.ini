# PullerView datasetting.ini（サンプル / 値はダミー。実運用値に置き換えること）
# 文字コード: UTF-8 / コメント行: '#' または ';'
# 1データ項目 = 1セクション。上下限が空欄の場合、その種別は判定しない。
#
# Name      : 読込データ名称（空欄かつ Address が MC.<iDINDEX> の場合、VB側 sCaption を流用）
# Address   : PcInfo.<フィールド名> / MC.<iDINDEX> / IOMonitor.<配列index>
# DataType  : Int16 / Int32 / Single / Double / Bool
# Decimals  : 小数点以下の表示桁数（PullerView独自設定）
# Unit      : 単位（空欄時は VB側 sUnit を流用）
# Enabled   : 表示有効 (1=表示 / 0=非表示)（PullerView独自設定）
# CtrlUpper / CtrlLower : 管理上限値 / 管理下限値
# MfgUpper  / MfgLower  : 製造上限値 / 製造下限値

[Data_001]
Name = Heater Temp
Address = PcInfo.strHEATER_TEMP
DataType = Single
Decimals = 1
Unit = degC
Enabled = 1
CtrlUpper = 1450.0
CtrlLower = 1400.0
MfgUpper = 1460.0
MfgLower = 1390.0

[Data_002]
Name =
Address = MC.1
DataType = Single
Decimals = 2
Unit =
Enabled = 1
CtrlUpper = 15.00
CtrlLower = 5.00
MfgUpper = 18.00
MfgLower = 3.00
