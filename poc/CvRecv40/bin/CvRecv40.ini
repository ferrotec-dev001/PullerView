; CvRecv40.ini — CvImageSaver 受信・保存部（.NET Framework 4.0 移植版）の設定（文字コード UTF-8）
[Camera]
ip=192.168.0.10        ; 画像処理コントローラの IP アドレス
port=8501              ; 画像出力ポート番号
camera_no=1            ; 対象カメラ番号。0＝全カメラ、1〜4＝そのカメラだけ
reconnect_sec=5        ; 再接続間隔 [秒]
timeout_sec=5          ; 接続タイムアウト [秒]
reject_checksum=0      ; 1＝チェックサム不一致の画像を破棄する
raw_dump=0             ; 1＝診断用に受信した生データを Log\raw-*.bin へ保存する（接続ごとに先頭 2MB）

[Image]
save=1                 ; 0＝保存しない
folder=Image           ; 保存先フォルダ（相対は EXE 基準）。OK／NG は判断せず 1 つのフォルダへ保存
process=               ; ファイル名に付ける工程名（例 NECK → YYYYMMDDHHMMSS_NECK.bmp）。空なら付けない
save_every=1           ; 間引き。N 枚に 1 枚だけ保存（1＝全数）
max_files=10           ; 最大保持枚数。超過分は古い順に削除（0＝無制限）
keep_days=30           ; 保持日数（0＝無効）
cleanup_hours=1        ; 日数による自動削除の間隔 [時間]

[Log]
folder=Log
